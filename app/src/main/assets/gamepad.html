<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body { background: #000; overflow: hidden; touch-action: none; }
#gamepad {
    position: fixed; bottom: 0; left: 0; right: 0; height: 200px;
    z-index: 9999; pointer-events: none;
    display: flex; justify-content: space-between; padding: 10px 20px;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
}
#gamepad.active { pointer-events: auto; }
.dpad {
    width: 140px; height: 140px; position: relative;
    background: rgba(255,255,255,0.1); border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
}
.dpad-btn {
    position: absolute; width: 44px; height: 44px;
    background: rgba(255,255,255,0.2); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.2);
}
.dpad-up { top: 4px; left: 50%; transform: translateX(-50%); }
.dpad-down { bottom: 4px; left: 50%; transform: translateX(-50%); }
.dpad-left { left: 4px; top: 50%; transform: translateY(-50%); }
.dpad-right { right: 4px; top: 50%; transform: translateY(-50%); }
.actions {
    display: flex; gap: 10px; align-items: flex-end; padding-bottom: 10px;
}
.action-btn {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: white; font-weight: bold;
}
.action-btn.ok { border-color: #4CAF50; color: #4CAF50; }
.action-btn.cancel { border-color: #f44336; color: #f44336; }
.action-btn.menu { border-color: #FF9800; color: #FF9800; width: 44px; height: 44px; font-size: 10px; }
#fps-counter {
    position: fixed; top: 4px; right: 4px; z-index: 9999;
    color: rgba(255,255,255,0.5); font-size: 10px;
    font-family: monospace; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px;
}
#toggle-gamepad {
    position: fixed; bottom: 4px; right: 4px; z-index: 9999;
    background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
    padding: 4px 8px; font-size: 10px; font-family: monospace;
}
</style>
</head>
<body>
<div id="gamepad" class="active">
    <div class="dpad" id="dpad">
        <div class="dpad-btn dpad-up" data-key="ArrowUp">▲</div>
        <div class="dpad-btn dpad-down" data-key="ArrowDown">▼</div>
        <div class="dpad-btn dpad-left" data-key="ArrowLeft">◀</div>
        <div class="dpad-btn dpad-right" data-key="ArrowRight">▶</div>
    </div>
    <div class="actions">
        <div class="action-btn menu" data-key="Escape">MENU</div>
        <div class="action-btn cancel" data-key="x" data-key2="Escape">✕</div>
        <div class="action-btn ok" data-key="z" data-key2="Enter" data-key3=" ">○</div>
    </div>
</div>
<div id="fps-counter">-- FPS</div>
<div id="toggle-gamepad">GAMEPAD</div>
<script>
(function() {
    // FPS counter
    var fpsEl = document.getElementById('fps-counter');
    var frames = 0, lastTime = performance.now();
    function updateFPS() {
        frames++;
        var now = performance.now();
        if (now - lastTime >= 1000) {
            fpsEl.textContent = frames + ' FPS';
            frames = 0;
            lastTime = now;
        }
        requestAnimationFrame(updateFPS);
    }
    requestAnimationFrame(updateFPS);

    // Gamepad toggle
    var gp = document.getElementById('gamepad');
    var tg = document.getElementById('toggle-gamepad');
    var gpVisible = true;
    tg.addEventListener('click', function() {
        gpVisible = !gpVisible;
        gp.style.display = gpVisible ? 'flex' : 'none';
        tg.textContent = gpVisible ? 'GAMEPAD' : 'SHOW';
    });

    // D-pad buttons - dispatch keyboard events to the game
    function dispatchKey(key, type) {
        var event = new KeyboardEvent(type, {
            key: key,
            code: key,
            bubbles: true,
            cancelable: true
        });
        // Try to find the game canvas and dispatch to it
        var canvas = document.querySelector('canvas');
        if (canvas) {
            canvas.dispatchEvent(event);
        }
        document.dispatchEvent(event);
    }

    // Touch start/end for d-pad buttons
    document.querySelectorAll('.dpad-btn, .action-btn').forEach(function(btn) {
        var keys = [];
        if (btn.dataset.key) keys.push(btn.dataset.key);
        if (btn.dataset.key2) keys.push(btn.dataset.key2);
        if (btn.dataset.key3) keys.push(btn.dataset.key3);

        function onStart(e) {
            e.preventDefault();
            btn.style.opacity = '0.5';
            keys.forEach(function(k) { dispatchKey(k, 'keydown'); });
        }
        function onEnd(e) {
            e.preventDefault();
            btn.style.opacity = '1';
            keys.forEach(function(k) { dispatchKey(k, 'keyup'); });
        }
        btn.addEventListener('touchstart', onStart, {passive: false});
        btn.addEventListener('touchend', onEnd, {passive: false});
        btn.addEventListener('touchcancel', onEnd, {passive: false});
        btn.addEventListener('mousedown', onStart);
        btn.addEventListener('mouseup', onEnd);
        btn.addEventListener('mouseleave', onEnd);
    });

    // Swipe detection for d-pad direction - more natural on mobile
    var touchStartX = 0, touchStartY = 0;
    var swiping = false;
    document.addEventListener('touchstart', function(e) {
        // Only handle touches in the lower part of screen for swipes
        var t = e.touches[0];
        if (t.clientY < window.innerHeight - 220) return; // Above gamepad area
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        swiping = true;
    }, {passive: true});

    document.addEventListener('touchmove', function(e) {
        if (!swiping) return;
        e.preventDefault();
        var t = e.touches[0];
        var dx = t.clientX - touchStartX;
        var dy = t.clientY - touchStartY;
        var threshold = 20;
        if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
            if (Math.abs(dx) > Math.abs(dy)) {
                dispatchKey(dx > 0 ? 'ArrowRight' : 'ArrowLeft', 'keydown');
                setTimeout(function() { dispatchKey(dx > 0 ? 'ArrowRight' : 'ArrowLeft', 'keyup'); }, 50);
            } else {
                dispatchKey(dy > 0 ? 'ArrowDown' : 'ArrowUp', 'keydown');
                setTimeout(function() { dispatchKey(dy > 0 ? 'ArrowDown' : 'ArrowUp', 'keyup'); }, 50);
            }
            touchStartX = t.clientX;
            touchStartY = t.clientY;
        }
    }, {passive: false});

    document.addEventListener('touchend', function() {
        swiping = false;
    }, {passive: true});

    // Override touch events on canvas to work with RPG Maker MV's touch input
    // RPG Maker MV/MZ uses TouchInput._onTouch which reads from TouchInput._events
    // We need to trigger keyboard events instead since the game expects them
    console.log('Runestone gamepad injected');
})();
</script>
</body>
</html>
